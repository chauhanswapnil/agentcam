# Model prices in US dollars per million tokens, used to estimate cost.
#
# `match` is a model id or the start of one (the longest match wins).
# Input and output prices are Anthropic's published first-party API rates
# (price list dated 2026-10-06). Where a cache price isn't published here,
# agentcam estimates cache reads at 10% of input and cache writes at 125%,
# and marks the cost as estimated.
#
# Add or override prices in prices.yaml next to the index. A model with no
# price shows its cost as unknown.
- { match: claude-fable-5-1, input: 10.00, output: 50.00, cache_read: 0.25 }
- { match: claude-fable-5, input: 10.00, output: 50.00 }
- { match: claude-mythos-5-1, input: 10.00, output: 50.00, cache_read: 0.25 }
- { match: claude-opus-5-5, input: 4.00, output: 20.00, cache_read: 0.20 }
- { match: claude-opus-5, input: 5.00, output: 25.00 }
- { match: claude-opus-4-8, input: 5.00, output: 25.00 }
- { match: claude-opus-4-7, input: 5.00, output: 25.00 }
- { match: claude-opus-4-6, input: 5.00, output: 25.00 }
- { match: claude-sonnet-5-5, input: 2.00, output: 10.00, cache_read: 0.20 }
- { match: claude-sonnet-5, input: 2.00, output: 10.00 }
- { match: claude-sonnet-4-6, input: 3.00, output: 15.00 }
