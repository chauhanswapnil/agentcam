# Model prices in US dollars per million tokens, used to estimate cost.
#
# These are the published API list prices (Anthropic and OpenAI price pages,
# read 2026-11-11). On a subscription you pay the plan price instead, so read
# the estimate as "what this work would cost on the API".
#
# Fields:
#   match           a model id or the start of one (the longest match wins)
#   input, output   fresh input and output tokens
#   cache_read      tokens read from the prompt cache   (default 10% of input)
#   cache_write     cache writes kept 5 minutes         (default 125% of input)
#   cache_write_1h  cache writes kept 1 hour            (default 200% of input)
#   long            prices for a call whose prompt is over `over` tokens:
#                   { over, input, output, cache_read }; cache writes scale
#                   with input
#   fast            what a fast (priority) call costs, as a multiple (default 2)
#   flex            what a flex call costs, as a multiple (default 0.5)
#
# Add or override prices in prices.yaml next to the index; an entry with the
# same `match` replaces the one here. A model with no price shows its cost as
# unknown, never a guess.

# Anthropic
- { match: claude-fable-5-2, input: 8.00, output: 40.00, cache_read: 0.20 }
- { match: claude-mythos-5-2, input: 8.00, output: 40.00, cache_read: 0.20 }
- { match: claude-fable-5-1, input: 10.00, output: 50.00, cache_read: 0.25 }
- { match: claude-mythos-5-1, input: 10.00, output: 50.00, cache_read: 0.25 }
- { match: claude-fable-5, input: 10.00, output: 50.00 }
- { match: claude-mythos-5, input: 10.00, output: 50.00 }
- { match: claude-opus-5-5, input: 4.00, output: 20.00, cache_read: 0.20 }
- { match: claude-opus-5, input: 5.00, output: 25.00 }
- { match: claude-opus-4-8, input: 5.00, output: 25.00 }
- { match: claude-opus-4-7, input: 5.00, output: 25.00 }
- { match: claude-opus-4-6, input: 5.00, output: 25.00 }
- { match: claude-opus-4-5, input: 5.00, output: 25.00 }
- { match: claude-opus-4-1, input: 15.00, output: 75.00 }
- { match: claude-opus-4, input: 15.00, output: 75.00 }
- { match: claude-sonnet-5-5, input: 2.00, output: 10.00, cache_read: 0.10 }
- { match: claude-sonnet-5, input: 2.00, output: 10.00 }
- { match: claude-sonnet-4, input: 3.00, output: 15.00 }
- match: claude-haiku-5-5
  input: 0.10
  output: 0.50
  long: { over: 100000, input: 0.50, output: 2.50 }
- { match: claude-haiku-4-5, input: 1.00, output: 5.00 }

# OpenAI. Cached input has its own price and cache writes cost the same as
# fresh input. A prompt over 272,000 tokens is charged at the `long` prices.
- match: gpt-6-astra
  input: 10.00
  output: 50.00
  cache_read: 1.00
  cache_write: 10.00
  cache_write_1h: 10.00
  long: { over: 272000, input: 20.00, output: 75.00, cache_read: 2.00 }
- match: gpt-6.1-sol
  input: 2.00
  output: 10.00
  cache_read: 0.10
