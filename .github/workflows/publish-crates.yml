# Publish the four crates to crates.io. dist calls this after the release
# artifacts are built (publish-jobs in dist-workspace.toml), and not for
# prereleases.
name: Publish crates

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  crates-io:
    runs-on: ubuntu-latest
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The server crate embeds the built UI, which isn't in git.
      - run: npm --prefix web ci && npm --prefix web run build
      - uses: dtolnay/rust-toolchain@stable
      # Publishes core, server, team, then the binary, in dependency order.
      # --allow-dirty: ui-dist is generated and gitignored.
      - run: cargo publish --workspace --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
