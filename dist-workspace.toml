[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Build the web UI before cargo builds the binary, so it gets embedded
github-build-setup = "../build-setup.yml"
# Homebrew tap the formula is pushed to (needs HOMEBREW_TAP_TOKEN)
tap = "chauhanswapnil/homebrew-tap"
# Publish after the GitHub release is built: Homebrew formula, npm package
# (needs NPM_TOKEN), and the four crates to crates.io (CARGO_REGISTRY_TOKEN,
# .github/workflows/publish-crates.yml). Prereleases publish to none of them.
publish-jobs = ["homebrew", "npm", "./publish-crates"]
# release.yml has one hand fix: dist 0.34 writes the crates.io job as
# `uses: $/.github/...`; it must be `./.github/...`. Re-apply it after
# `dist generate`.
allow-dirty = ["ci"]
