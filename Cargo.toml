[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/chauhanswapnil/agentcam"
homepage = "https://github.com/chauhanswapnil/agentcam"
authors = ["Swapnil Chauhan"]
keywords = ["ai", "agents", "claude", "codex", "observability"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
agentcam-core = { path = "crates/agentcam-core", version = "=0.1.0-rc.1" }
agentcam-server = { path = "crates/agentcam-server", version = "=0.1.0-rc.1" }
agentcam-team = { path = "crates/agentcam-team", version = "=0.1.0-rc.1" }
anyhow = "1"
axum = "0.8"
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "6"
getrandom = "0.3"
sha2 = "0.10"
mime_guess = "2"
notify = "8"
open = "5"
rayon = "1.12"
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
thiserror = "2"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
ureq = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
